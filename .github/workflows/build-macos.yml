name: Build Mac app

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  macos:
    runs-on: macos-14
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller

      - name: Bundle Rhubarb Lip Sync
        run: |
          curl -fsSL -o rhubarb.zip https://github.com/DanielSWolf/rhubarb-lip-sync/releases/download/v1.14.0/Rhubarb-Lip-Sync-1.14.0-macOS.zip
          rm -rf vendor/rhubarb rhubarb-src
          mkdir -p vendor/rhubarb
          unzip -q rhubarb.zip -d rhubarb-src
          bin=$(find rhubarb-src -type f -name rhubarb | head -1)
          res=$(find rhubarb-src -type d -name res | head -1)
          test -n "$bin" && test -n "$res"
          cp "$bin" vendor/rhubarb/rhubarb
          chmod +x vendor/rhubarb/rhubarb
          cp -R "$res" vendor/rhubarb/res

      - name: Bundle speech model
        run: |
          python -m pip install -q huggingface_hub
          python - << 'PY'
          from huggingface_hub import snapshot_download
          snapshot_download(
              "Systran/faster-whisper-small",
              local_dir="vendor/speech-model",
              allow_patterns=["config.json", "preprocessor_config.json", "model.bin", "tokenizer.json", "vocabulary.*"],
          )
          PY
          test -f vendor/speech-model/model.bin
          python - << 'PY'
          import base64
          from pathlib import Path
          folder = Path("vendor/backgrounds")
          for name in ("coffee-shop", "library"):
              raw = (folder / f"{name}.b64").read_text().strip()
              (folder / f"{name}.jpg").write_bytes(base64.b64decode(raw))
          PY
          test -f vendor/backgrounds/coffee-shop.jpg
          test -f vendor/backgrounds/library.jpg

      - name: Build app
        run: |
          pyinstaller --noconfirm --windowed --name PodcastProcessor \
            --collect-all whisperx \
            --collect-all pyannote \
            --collect-all imageio_ffmpeg \
            --collect-all certifi \
            --collect-all faster_whisper \
            --add-data "vendor/speech-model:speech-model" \
            --add-data "vendor/backgrounds:backgrounds" \
            --add-binary "vendor/rhubarb/rhubarb:." \
            --add-data "vendor/rhubarb/res:res" \
            --hidden-import podcast_processor \
            --hidden-import podcast_video \
            --hidden-import cast_library \
            --hidden-import draw_avatar \
            --hidden-import rhubarb_sync \
            --hidden-import stage \
            --hidden-import opentoonz_export \
            --hidden-import PIL.ImageTk \
            PodcastApp.py
          PLIST="dist/PodcastProcessor.app/Contents/Info.plist"
          /usr/libexec/PlistBuddy -c "Delete :NSRequiresAquaSystemAppearance" "$PLIST" || true
          /usr/libexec/PlistBuddy -c "Add :NSRequiresAquaSystemAppearance bool true" "$PLIST"
          codesign --force --deep --sign - "dist/PodcastProcessor.app" || true
          ditto -c -k --keepParent "dist/PodcastProcessor.app" PodcastProcessor-macOS.zip

      - uses: actions/upload-artifact@v4
        with:
          name: PodcastProcessor-macOS
          path: PodcastProcessor-macOS.zip
          if-no-files-found: error
